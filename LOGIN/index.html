<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Secure access to CareBridge Portal for authorized healthcare professionals, clinical staff, and portal users." />
  <meta name="theme-color" content="#0a335c" />

  <!-- Favicon using official emblem -->
  <link rel="icon" type="image/png" href="./assets/logo.png" />

  <!-- Modern Typography (Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <div id="app">

        <p>Please enable JavaScript in your browser to access the CareBridge Portal.</p>

  <script type="module" src="./js/app.js"></script>
